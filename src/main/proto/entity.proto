syntax = "proto3";

option java_package = "protonova.protobuf";
option java_outer_classname = "EntityProto";

import "vector.proto";

message Entity {
  string name = 1;
  Vector position = 2;
  int32 map = 3;
  int32 id = 4;
  double speed = 5;
  Vector velocity = 6;
  bool item = 7;
  map<string,int32> hands = 8;
}
