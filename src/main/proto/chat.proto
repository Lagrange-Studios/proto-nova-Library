syntax = "proto3";

option java_package = "protonova.protobuf";
option java_outer_classname = "ChatProto";

import "vector.proto";

enum ChatType {
  Local = 0;
  Whisper = 1;
}

message ChatMessage {
	ChatType chatType = 1;
	string message = 2;
	int32 maxTime = 3;
	int32 entityID = 4;
	optional Vector position = 5;
	int32 map = 8;
	uint64 chatID = 9;
}
