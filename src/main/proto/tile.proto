syntax = "proto3";

package protonova;

option java_package = "protonova.protobuf";
option java_outer_classname = "TileProto";

import "coordinate.proto";

message Tile {
  string name = 1;
  Coordinate coordinate = 2;
  int32 variant = 3;
  optional string surfaceTexture = 4;
  float movementDifficulty = 5;
}
