syntax = "proto3";

package protonova;

import "vector.proto";

option java_package = "protonova.protobuf";
option java_outer_classname = "ActionProto";

enum ActionType {
  MoveUp = 0;
  MoveDown = 1;
  MoveLeft = 2;
  MoveRight = 3;
  Interact = 4;
  StopX = 5;
  StopY = 6;
}

enum InteractionType {
	PickUp = 0;
	Drop = 1;
	Craft = 2;
	Hit = 3;
	Consume = 4;
	Standard = 5;
	DropOne = 6;
	Inventory = 7;
}


message Action {
	ActionType actionType = 1;
	int32 interactingEntityId = 2;
	Vector interactionPosition = 3;
	InteractionType interactionType = 4;
	string slotName = 5;
}
