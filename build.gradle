plugins {
    id 'java'
    id 'com.google.protobuf' version '0.10.0'
}

group = 'com.protonova'
version = '1.0-SNAPSHOT'

// Build and run against Java 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    
    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {} // generate Java sources
            }
        }
    }
}

// Ensure Java compilation depends on proto generation
tasks.withType(JavaCompile) {
    dependsOn tasks.withType(com.google.protobuf.gradle.GenerateProtoTask)
}

// Configure JAR manifest
jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Proto Nova',
            'Created-By': System.getProperty('java.version')
        )
    }
}

// Exclude proto files from resources
tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('**/*.proto')
}
