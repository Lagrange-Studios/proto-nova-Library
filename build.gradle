plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {} // generate Java sources
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
        }
        java {
            srcDir 'build/generated/source/proto/main/java'
        }
    }
}

// Optional: ensure Java compilation depends on proto generation
tasks.withType(JavaCompile) {
    dependsOn tasks.withType(com.google.protobuf.gradle.GenerateProtoTask)
}


tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('**/*.proto')
}


//regenerates all proto files every time gradle builds
tasks.withType(com.google.protobuf.gradle.GenerateProtoTask).configureEach {
    outputs.upToDateWhen { false }
}
